<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="DhaShu — built for meaningful relationships that last, not just matches that spark. Verified before you ever meet. Launching in Delhi NCR, Mumbai and Bengaluru.">
<meta name="theme-color" content="#4E1529">
<meta property="og:title" content="DhaShu">
<meta property="og:description" content="Built for meaningful relationships that last — not just matches that spark.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DhaShu">
<meta property="og:url" content="https://dhashu.com/">
<meta property="og:image" content="https://dhashu.com/media/promo-poster.jpg">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta property="og:image:alt" content="DhaShu — built for meaningful relationships that last.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DhaShu">
<meta name="twitter:description" content="Built for meaningful relationships that last — not just matches that spark.">
<meta name="twitter:image" content="https://dhashu.com/media/promo-poster.jpg">
<link rel="canonical" href="https://dhashu.com/">
<title>DhaShu</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  html{ -webkit-text-size-adjust:100%; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<!-- ═══ icon sprite ═══════════════════════════════════════════════════
     Line icons drawn to match the DhaShu one-pager. Referenced from
     content.js by name, e.g. icon: 'target'. Add a new one by adding a
     <symbol id="icon-yourname"> here and naming it in content.js.
     ═══════════════════════════════════════════════════════════════════ -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="g-stroke" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="icon-target" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.4"/>
    <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-shield" viewBox="0 0 24 24">
    <path d="M12 2.8l7.3 2.9v5.6c0 4.4-3 7.9-7.3 8.9-4.3-1-7.3-4.5-7.3-8.9V5.7z"/>
    <path d="M8.8 12.1l2.3 2.3 4.3-4.8"/>
  </symbol>

  <symbol id="icon-calendar" viewBox="0 0 24 24">
    <rect x="3.3" y="5.4" width="17.4" height="15.3" rx="2.2"/>
    <path d="M3.3 10.2h17.4M8.2 3.2v4.3M15.8 3.2v4.3"/>
    <path d="M7.4 14h3M7.4 17.4h7.4"/>
  </symbol>

  <symbol id="icon-exchange" viewBox="0 0 24 24">
    <path d="M3.4 8.8h13.2M13.2 5.4l3.4 3.4-3.4 3.4"/>
    <path d="M20.6 15.2H7.4M10.8 18.6l-3.4-3.4 3.4-3.4"/>
  </symbol>

  <symbol id="icon-document" viewBox="0 0 24 24">
    <path d="M6.6 3.3h7.3l4.5 4.6V20a1.6 1.6 0 0 1-1.6 1.6H6.6A1.6 1.6 0 0 1 5 20V4.9a1.6 1.6 0 0 1 1.6-1.6z"/>
    <path d="M13.8 3.3v4.7h4.6"/>
    <path d="M8.6 14.7l2 2 4.2-4.4"/>
  </symbol>

  <symbol id="icon-sprout" viewBox="0 0 24 24">
    <path d="M12 21v-7.4"/>
    <path d="M12 13.6c0-3.4-2.8-6.2-6.2-6.2 0 3.4 2.8 6.2 6.2 6.2z"/>
    <path d="M12 13.6c0-4 3.3-7.3 7.3-7.3 0 4-3.3 7.3-7.3 7.3z"/>
  </symbol>

  <symbol id="icon-lock" viewBox="0 0 24 24">
    <rect x="4.6" y="10.3" width="14.8" height="10.4" rx="2.2"/>
    <path d="M8.2 10.3V7.4a3.8 3.8 0 0 1 7.6 0v2.9"/>
    <circle cx="12" cy="15.3" r="1.35" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-heart" viewBox="0 0 24 24">
    <path d="M12 20.6l-1.4-1.3C5.9 15 2.6 12 2.6 8.4 2.6 5.5 4.9 3.2 7.8 3.2c1.6 0 3.2.8 4.2 2.1 1-1.3 2.6-2.1 4.2-2.1 2.9 0 5.2 2.3 5.2 5.2 0 3.6-3.3 6.6-8 10.9z"/>
  </symbol>

  <symbol id="icon-question" viewBox="0 0 24 24">
    <path d="M21 11.8c0 4.1-4 7.5-8.9 7.5-1 0-2.1-.15-3-.44L3.6 20.6l1.5-3.8C3.8 15.4 3.1 13.7 3.1 11.8c0-4.1 4-7.5 8.9-7.5s9 3.4 9 7.5z"/>
    <path d="M9.8 9.6a2.3 2.3 0 1 1 2.9 2.2c-.55.2-.9.7-.9 1.3v.4"/>
    <circle cx="11.8" cy="15.6" r=".95" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.8"/><path d="M12 6.6v5.7l3.6 2.1"/>
  </symbol>

  <symbol id="icon-trend" viewBox="0 0 24 24">
    <path d="M3.2 17.4L9 11.3l3.6 3.6 8.2-8.5"/>
    <path d="M15.6 6.4h5.2v5.2"/>
  </symbol>

  <symbol id="icon-check" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.8"/><path d="M8.1 12.2l2.7 2.7 5-5.4"/>
  </symbol>

  <symbol id="icon-speech" viewBox="0 0 24 24">
    <path d="M2.8 9.1c0-2.6 2.7-4.8 6.1-4.8s6.1 2.2 6.1 4.8-2.7 4.8-6.1 4.8c-.75 0-1.5-.1-2.15-.3L3.3 15.3l1-2.5C3.3 11.8 2.8 10.5 2.8 9.1z"/>
    <path d="M16.6 10.1c2.7.55 4.6 2.4 4.6 4.6 0 1.25-.6 2.4-1.6 3.25l1 2.4-3.3-1.3c-.65.18-1.35.28-2.1.28-2.45 0-4.6-1.1-5.6-2.75"/>
  </symbol>

  <symbol id="icon-hearts" viewBox="0 0 24 24">
    <path d="M9.1 19.2l-1-1C4.2 14.6 2 12.5 2 9.9 2 7.75 3.75 6 5.9 6c1.25 0 2.4.6 3.2 1.5C9.9 6.6 11.05 6 12.3 6c2.15 0 3.9 1.75 3.9 3.9 0 2.6-2.2 4.7-6.1 8.3z"/>
    <path d="M16.6 14.5c3.2-3 5.4-5.1 5.4-7.7 0-2.15-1.75-3.9-3.9-3.9-1.25 0-2.4.6-3.2 1.5"/>
  </symbol>

  <symbol id="icon-wallet" viewBox="0 0 24 24">
    <path d="M9.4 2.9h5.2l-1.5 3.1h-2.2z"/>
    <path d="M13.2 6c3.5 1.25 5.9 4.4 5.9 8 0 3.6-2.8 6.9-7.1 6.9S4.9 17.6 4.9 14c0-3.6 2.4-6.75 5.9-8"/>
    <path d="M12 10.1v7.6M13.9 11.7h-2.65a1.4 1.4 0 0 0 0 2.8h1.5a1.4 1.4 0 0 1 0 2.8H9.9"/>
  </symbol>

  <symbol id="icon-handshake" viewBox="0 0 24 24">
    <path d="M2.6 10.4l3.2-3.2h3.6l2.6 2.6"/>
    <path d="M21.4 10.4l-3.2-3.2h-3.6L12 9.8"/>
    <path d="M12 9.8l-2.5 2.5a1.7 1.7 0 0 0 2.4 2.4l.6-.6 1.7 1.7a1.6 1.6 0 0 0 2.25-2.25l-1.7-1.7"/>
    <path d="M2.6 10.4l2.7 2.7M21.4 10.4l-2.7 2.7"/>
  </symbol>

  <!-- stage icons: dating, relationship, engaged, married -->
  <symbol id="icon-ring" viewBox="0 0 24 24">
    <circle cx="12" cy="15.1" r="5.9"/>
    <path d="M9.2 10.1l1.1-2.6h3.4l1.1 2.6"/>
    <path d="M12 2.6l2.1 2.4-2.1 2.5-2.1-2.5z"/>
  </symbol>

  <symbol id="icon-wedding" viewBox="0 0 24 24">
    <path d="M3 11.2L12 4l9 7.2"/>
    <path d="M5.3 10v10.4h13.4V10"/>
    <path d="M8.5 13.4c0-1.05.9-1.9 1.95-1.9.6 0 1.15.27 1.55.7.4-.43.95-.7 1.55-.7 1.05 0 1.95.85 1.95 1.9 0 1.45-1.4 2.65-3.5 4.5-2.1-1.85-3.5-3.05-3.5-4.5z"/>
  </symbol>

  <symbol id="icon-play" viewBox="0 0 24 24">
    <path d="M9.4 7.6l7.2 4.4-7.2 4.4z" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-compass" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.2"/>
    <path d="M15.9 8.1l-2.2 5.6-5.6 2.2 2.2-5.6z"/>
    <circle cx="12" cy="12" r="1.05" fill="currentColor" stroke="none"/>
  </symbol>
</svg>

<!-- ═══ sticky navigation ══════════════════════════════════════════════ -->
<nav class="nav" id="nav">
  <div class="inner nav-inner">
    <a class="nav-mark" href="#top">DhaShu</a>
    <div class="nav-links" id="nav-links"></div>
    <a class="nav-cta" href="#join" id="nav-cta"></a>
  </div>
</nav>

<!-- ═══ hero ═══════════════════════════════════════════════════════════ -->
<div class="band hero" id="top">
  <div class="inner hero-row">
    <div class="hero-left">
      <p class="eyebrow" id="hero-operator"></p>
      <h1 class="wordmark" id="hero-wordmark"></h1>
      <p class="tagline" id="hero-tagline"></p>
      <div class="hero-meta" id="hero-meta"></div>
      <a class="cta" href="#join" id="hero-cta"></a>
    </div>
    <div class="seal-wrap">
      <img class="hero-logo" src="media/dhashu-logo.png" width="371" height="135" alt="DhaShu — Start with Truth, Build with Trust">
    </div>
  </div>
</div>

<!-- ═══ the two films ══════════════════════════════════════════════════ -->
<div class="band tint" id="watch">
  <section class="inner">
    <div class="sec-head" id="watch-head"></div>
    <div class="films" id="watch-films"></div>
  </section>
</div>

<!-- ═══ the arc ════════════════════════════════════════════════════════ -->
<div class="band" id="arc">
  <section class="inner">
    <div class="sec-head" id="arc-head"></div>
    <div class="arc" id="arc-grid"></div>
    <p class="note" id="arc-note"></p>
  </section>
</div>

<!-- ═══ the 169-day plan ═══════════════════════════════════════════════ -->
<div class="band tint" id="plan">
  <section class="inner">
    <div class="sec-head" id="plan-head"></div>
    <div class="track">
      <div class="track-labels" id="track-labels"></div>
      <div class="track-bar" id="track-bar"></div>
      <div class="track-ticks" id="track-ticks"></div>
      <div class="track-finish" id="track-finish"></div>
    </div>
    <div class="plan-quote" id="plan-quote"></div>
    <p class="plan-foot" id="plan-foot"></p>
  </section>
</div>

<!-- ═══ how a week works ═══════════════════════════════════════════════ -->
<div class="band" id="week">
  <section class="inner">
    <div class="sec-head" id="week-head"></div>
    <div class="week" id="week-rows"></div>
  </section>
</div>

<!-- ═══ Guru ═══════════════════════════════════════════════════════════ -->
<div class="band guru-band" id="guru">
  <section class="inner">
    <div class="guru-head">
      <span class="guru-mark" id="guru-mark"></span>
      <p class="eyebrow" id="guru-eyebrow"></p>
      <h2 id="guru-heading"></h2>
      <p class="guru-lede" id="guru-lede"></p>
    </div>
    <div class="pillars" id="guru-pillars"></div>
    <p class="note guru-note" id="guru-note"></p>
  </section>
</div>

<!-- ═══ verification ═══════════════════════════════════════════════════ -->
<div class="band" id="verify">
  <section class="inner">
    <div class="sec-head" id="verify-head"></div>
    <div class="verify">
      <div class="vgrid">
        <div class="vcol">
          <h3>Independently verified</h3>
          <ul class="vlist" id="verify-list"></ul>
        </div>
        <div class="vcol" id="verify-photo"></div>
      </div>
    </div>
    <p class="vnote" id="verify-custody"></p>
  </section>
</div>

<!-- ═══ the twelve principles ══════════════════════════════════════════ -->
<div class="band tint" id="principles">
  <section class="inner">
    <div class="sec-head" id="principles-head"></div>
    <div class="principles" id="principles-list"></div>
  </section>
</div>

<!-- ═══ waitlist ═══════════════════════════════════════════════════════ -->
<div class="band join" id="join">
  <section class="inner">
    <div class="sec-head" id="join-head"></div>
    <form id="waitlist" novalidate>
      <div class="frow">
        <div class="field">
          <label for="wl-email">Email</label>
          <input type="email" id="wl-email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="wl-city">City or country</label>
          <select id="wl-city" name="city" required></select>
        </div>
      </div>
      <div class="frow">
        <div class="field">
          <label for="wl-gender">I am</label>
          <select id="wl-gender" name="gender" required></select>
        </div>
        <div class="field">
          <label for="wl-age">Age</label>
          <select id="wl-age" name="age_band" required></select>
        </div>
      </div>
      <p class="consent" id="wl-consent"></p>
      <button type="submit" id="wl-submit"></button>
    </form>
    <div class="result" id="wl-result" hidden></div>
  </section>
</div>

<!-- ═══ footer ═════════════════════════════════════════════════════════ -->
<div class="band">
  <footer class="inner">
    <div class="foot-grid">
      <div class="foot-col" id="foot-operator"></div>
      <div class="foot-col" id="foot-contact"></div>
      <div class="foot-col" id="foot-status"></div>
    </div>
    <p class="fine" id="foot-fine"></p>
  </footer>
</div>

<script src="content.js"></script>
<script src="app.js"></script>

</body>
</html>
