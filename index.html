<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* One place to configure the story.
   HOME_URL : where Skip and the last scene's button go. The previous home page lives here, unchanged.
   REVEAL   : 'each' shows the DhaShu answer after every pick. 'end' auto-advances after each pick and skips the answer cards.
   LENGTH   : 'full' runs all 9 scenes. 'short' runs swindler, one-at-a-time and guru only.
   PHOTOS   : optional scene photos, for example { swindler: 'assets/photos/swindler.webp' }. Empty means the cream fill. */
window.STORY_CONFIG = { HOME_URL: '/home.html', REVEAL: 'each', LENGTH: 'full', PHOTOS: {} };
/* Returning visitors who skipped or finished go straight to the home page. /?story=1 always shows the story. */
(function () {
  try {
    if (!/[?&]story=1(&|$)/.test(location.search) && localStorage.getItem('dhashu_story_seen') === '1') {
      location.replace(window.STORY_CONFIG.HOME_URL + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>
<title>DhaShu · Start with truth. Build with trust.</title>
